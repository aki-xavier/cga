<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CGS Editor</title>
<style>
  :root {
    --bg: #1e1e28;
    --panel: #16161e;
    --fg: #dfe2ea;
    --muted: #8a90a0;
    --accent: #61afef;
    --ok: #2e7d32;
    --err: #c62828;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column;
    background: var(--bg); color: var(--fg);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    background: var(--panel); padding: 6px 12px;
  }
  header .title { font-weight: 600; color: var(--accent); }
  header button {
    background: #2a2a3a; color: var(--fg); border: 1px solid #3a3a4a;
    border-radius: 4px; padding: 3px 10px; cursor: pointer;
  }
  header button:hover { background: #34344a; }
  main { flex: 1; display: flex; min-height: 0; }
  .editor-wrap { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .editor {
    flex: 1; position: relative; overflow: hidden;
  }
  #code, #highlight {
    position: absolute; inset: 0; margin: 0; padding: 12px;
    border: none; outline: none; resize: none;
    font: inherit; line-height: 1.5; white-space: pre; overflow: auto;
    background: transparent;
  }
  #code { color: var(--fg); caret-color: var(--fg); z-index: 2; }
  #highlight { color: transparent; pointer-events: none; z-index: 1; }
  #code::selection { background: rgba(90,120,255,.35); }
  .side { width: 340px; display: flex; flex-direction: column; border-left: 1px solid #2a2a3a; }
  .preview {
    height: 320px; display: flex; align-items: center; justify-content: center;
    background: #101018; overflow: hidden;
  }
  .preview img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .preview .placeholder { color: var(--muted); }
  .status { padding: 6px 12px; font-size: 12px; }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--err); }
  .params { flex: 1; overflow-y: auto; padding: 8px 12px; }
  .params h3 { margin: 0 0 6px; font-size: 12px; color: var(--muted); font-weight: 500; }
  .param { margin-bottom: 8px; }
  .param .row { display: flex; justify-content: space-between; font-size: 12px; }
  .param .row .label { color: var(--muted); }
  .param .row .val { color: var(--fg); }
  .param input[type=range] { width: 100%; accent-color: var(--accent); }
</style>
</head>
<body>
<header>
  <span class="title">CGS Editor</span>
  <button id="new">＋ 新建</button>
  <button id="load">加载示例</button>
  <button id="save">保存 .cgs</button>
</header>
<main>
  <div class="editor-wrap">
    <div class="editor">
      <pre id="highlight" aria-hidden="true"></pre>
      <textarea id="code" spellcheck="false">sphere(r=1);
</textarea>
    </div>
  </div>
  <div class="side">
    <div class="preview" id="preview"><span class="placeholder">预览加载中…</span></div>
    <div class="status" id="status">就绪</div>
    <div class="params" id="params"><h3>参数</h3></div>
  </div>
</main>

<script>
const code = document.getElementById('code');
const highlight = document.getElementById('highlight');
const preview = document.getElementById('preview');
const status = document.getElementById('status');
const paramsBox = document.getElementById('params');

const EXAMPLES = [
  'sphere(r=1);\n',
  'translate([0, 1, 0]) sphere(r=0.5);\n',
  'difference() {\n  box(s=[2,2,2]);\n  sphere(r=1.2);\n}\n',
  'for (i = [0:2]) translate([i, 0, 0]) sphere(r=0.3);\n'
];

let debounceTimer = null;
let currentParams = [];

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// --- syntax highlighting (mirrors editor/highlight.v) ---
const KEYWORDS = /\b(module|for|if|else|echo|union)\b/;
const CONSTANTS = /\b(true|false|pi)\b/;
const TYPES = /\b(sphere|plane|cylinder|box|circle|translate|rotate|material|directional_light|point_light|ambient_light|background|camera)\b/;
const FUNCS = /\b(abs|sign|sin|cos|tan|asin|acos|atan|atan2|sqrt|exp|ln|log|floor|ceil|round|pow|min|max|len|norm|cross)\b/;
const COLORS = {
  comment: '#6a737d', keyword: '#c678dd', type: '#61afef', function: '#e5c07b',
  constant: '#d19a66', number: '#d19a66', operator: '#56b6c2', punctuation: '#9da5b4'
};
function colorize(text) {
  let html = '';
  let i = 0;
  const n = text.length;
  const push = (cls, s) => { html += `<span style="color:${COLORS[cls]}">${escapeHtml(s)}</span>`; };
  while (i < n) {
    const c = text[i];
    if (c === '/' && text[i+1] === '/') {
      let j = i; while (j < n && text[j] !== '\n') j++;
      push('comment', text.slice(i, j)); i = j; continue;
    }
    if (/[0-9]/.test(c)) {
      let j = i; while (j < n && /[0-9.]/.test(text[j])) j++;
      push('number', text.slice(i, j)); i = j; continue;
    }
    if (/[A-Za-z_]/.test(c)) {
      let j = i; while (j < n && /[A-Za-z0-9_]/.test(text[j])) j++;
      const w = text.slice(i, j);
      const cls = KEYWORDS.test(w) ? 'keyword' : CONSTANTS.test(w) ? 'constant'
        : TYPES.test(w) ? 'type' : FUNCS.test(w) ? 'function' : null;
      if (cls) push(cls, w); else html += escapeHtml(w);
      i = j; continue;
    }
    if ('+-*/%<>!:=,;[](){}'.includes(c)) {
      const cls = ':,;[](){}='.includes(c) ? 'punctuation' : 'operator';
      push(cls, c); i++; continue;
    }
    html += escapeHtml(c); i++;
  }
  return html;
}

function updateHighlight() {
  highlight.innerHTML = colorize(code.value) + '\n';
  highlight.scrollTop = code.scrollTop;
  highlight.scrollLeft = code.scrollLeft;
}

// --- render + params ---
async function render() {
  const text = code.value;
  status.textContent = '渲染中…';
  status.className = 'status';
  try {
    const resp = await fetch('/render?w=720&h=500&aa=1', { method: 'POST', body: text });
    if (resp.ok) {
      const blob = await resp.blob();
      const url = URL.createObjectURL(blob);
      preview.innerHTML = `<img src="${url}">`;
      status.textContent = '已渲染';
      status.className = 'status ok';
    } else {
      preview.innerHTML = '<span class="placeholder">渲染失败</span>';
      status.textContent = await resp.text();
      status.className = 'status err';
    }
  } catch (e) {
    preview.innerHTML = '<span class="placeholder">渲染失败</span>';
    status.textContent = '渲染服务不可达: ' + e;
    status.className = 'status err';
  }
  refreshParams();
}

async function refreshParams() {
  try {
    const resp = await fetch('/params', { method: 'POST', body: code.value });
    currentParams = resp.ok ? await resp.json() : [];
  } catch (e) {
    currentParams = [];
  }
  buildSliders();
}

function buildSliders() {
  paramsBox.innerHTML = `<h3>参数 (${currentParams.length} 个可拖拽)</h3>`;
  if (currentParams.length === 0) {
    paramsBox.innerHTML += '<div style="color:#6a7080;font-size:12px">无数值参数</div>';
    return;
  }
  for (const p of currentParams) {
    const wrap = document.createElement('div');
    wrap.className = 'param';
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<span class="label">${escapeHtml(p.label)}</span><span class="val">${(+p.value).toFixed(3)}</span>`;
    const input = document.createElement('input');
    input.type = 'range';
    input.min = p.min; input.max = p.max; input.step = p.step; input.value = p.value;
    input.addEventListener('input', () => {
      row.querySelector('.val').textContent = (+input.value).toFixed(3);
      applySlider(p.label, p.ordinal, +input.value);
    });
    wrap.appendChild(row); wrap.appendChild(input);
    paramsBox.appendChild(wrap);
  }
}

function formatNumber(v) {
  let s = v.toFixed(4).replace(/0+$/, '').replace(/\.$/, '');
  if (s === '' || s === '-0' || s === '-') s = '0';
  return s;
}

async function applySlider(label, ordinal, value) {
  // re-fetch current params to get fresh byte offsets, then patch the text
  let ps = currentParams;
  try {
    const resp = await fetch('/params', { method: 'POST', body: code.value });
    if (resp.ok) ps = await resp.json();
  } catch (e) { /* ignore */ }
  const p = ps.find(q => q.label === label && q.ordinal === ordinal);
  if (!p) return;
  const text = code.value;
  code.value = text.slice(0, p.start) + formatNumber(value) + text.slice(p.end);
  currentParams = ps;
  updateHighlight();
  schedule();
}

function schedule() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(render, 300);
}

// --- events ---
code.addEventListener('input', () => { updateHighlight(); schedule(); });
code.addEventListener('scroll', () => {
  highlight.scrollTop = code.scrollTop;
  highlight.scrollLeft = code.scrollLeft;
});
document.getElementById('new').addEventListener('click', () => {
  code.value = 'sphere(r=1);\n'; updateHighlight(); render();
});
document.getElementById('load').addEventListener('click', () => {
  code.value = EXAMPLES[Math.floor(Math.random() * EXAMPLES.length)];
  updateHighlight(); render();
});
document.getElementById('save').addEventListener('click', () => {
  const blob = new Blob([code.value], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'scene.cgs'; a.click();
});

// init
updateHighlight();
render();
</script>
</body>
</html>
