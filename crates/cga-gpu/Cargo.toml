[package]
name = "cga-gpu"
version = "0.1.0"
edition = "2021"
description = "cga GPU batch kernels (mlx-rs/Metal ray tracing), port of the V `cga_gpu` module."

[dependencies]
cga-core = { path = "../cga-core" }
mlx-rs = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde_json = "1"
base64 = "0.22"

[lints]
workspace = true
