<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CGA 机器人应用 · Diagram Design</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>CGA 在机器人领域的潜在应用</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cga-robotics-title cga-robotics-desc">
      <title id="cga-robotics-title">CGA 在机器人领域的潜在应用</title>
      <desc id="cga-robotics-desc">cga 的代数层（blade 图元与 Motor versor）和渲染层（GPU 光线追踪与逆渲染 round-trip）向五个机器人应用方向供给能力：仿真合成数据、运动学轨迹、几何感知输出、重建回环验证与统一坐标变换。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zones -->
      <rect x="44" y="40" width="384" height="92" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="48" y="44" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="72" y="53" fill="rgba(45,49,66,0.45)" font-size="9" font-family="'Geist Mono','PingFang SC',monospace" text-anchor="middle" letter-spacing="0.10em">代数层</text>

      <rect x="476" y="40" width="384" height="92" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="480" y="44" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="504" y="53" fill="rgba(45,49,66,0.45)" font-size="9" font-family="'Geist Mono','PingFang SC',monospace" text-anchor="middle" letter-spacing="0.10em">渲染层</text>

      <rect x="44" y="192" width="848" height="92" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="48" y="196" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="84" y="205" fill="rgba(45,49,66,0.45)" font-size="9" font-family="'Geist Mono','PingFang SC',monospace" text-anchor="middle" letter-spacing="0.10em">机器人应用</text>

      <!-- Arrows -->
      <line x1="120" y1="116" x2="120" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 156,116 V 164 Q 156,172 164,172 H 292 Q 300,172 300,180 V 220" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 308,116 V 164 Q 308,172 316,172 H 460 Q 468,172 468,180 V 220" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 340,116 V 140 Q 340,148 348,148 H 628 Q 636,148 636,156 V 220" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 640,116 V 272 Q 640,280 632,280 H 140 Q 132,280 132,272 V 268" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 764,116 V 140 Q 764,148 772,148 H 796 Q 804,148 804,156 V 220" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Nodes: 代数层 -->
      <rect x="60" y="68" width="160" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="60" y="68" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="140" y="94" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="middle">blade 图元</text>
      <text x="140" y="110" fill="#4f5d75" font-size="9" font-family="'Geist Mono','PingFang SC',monospace" text-anchor="middle">平面/球/圆柱/圆/盒</text>

      <rect x="244" y="68" width="160" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="244" y="68" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="324" y="94" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Motor versor</text>
      <text x="324" y="110" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">exp/log · velocity</text>

      <!-- Nodes: 渲染层 -->
      <rect x="492" y="68" width="160" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="492" y="68" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="572" y="94" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="middle">mlx-rs GPU 光线追踪</text>
      <text x="572" y="110" fill="#4f5d75" font-size="9" font-family="'Geist Mono','PingFang SC',monospace" text-anchor="middle">合成深度/RGB</text>

      <rect x="676" y="68" width="160" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="676" y="68" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="756" y="94" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="middle">逆渲染 round-trip</text>
      <text x="756" y="110" fill="#4f5d75" font-size="9" font-family="'Geist Mono','PingFang SC',monospace" text-anchor="middle">模型→图像验证</text>

      <!-- Nodes: 机器人应用 -->
      <rect x="60" y="220" width="144" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="60" y="220" width="144" height="48" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="132" y="246" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="middle">仿真与合成数据</text>

      <rect x="228" y="220" width="144" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="228" y="220" width="144" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="300" y="246" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="middle">几何感知输出</text>

      <rect x="396" y="220" width="144" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="396" y="220" width="144" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="468" y="246" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="middle">运动学与轨迹</text>

      <rect x="564" y="220" width="144" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="564" y="220" width="144" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="636" y="246" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="middle">统一坐标变换</text>

      <rect x="732" y="220" width="144" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="732" y="220" width="144" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="804" y="246" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="middle">重建回环验证</text>

      <!-- Legend -->
      <line x1="44" y1="500" x2="916" y2="500" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="44" y="508" fill="#4f5d75" font-size="8" font-family="'Geist Mono','PingFang SC',monospace" letter-spacing="0.14em">图例</text>

      <line x1="104" y1="504" x2="136" y2="504" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="148" y="508" fill="#4f5d75" font-size="8" font-family="'Geist Mono','PingFang SC',monospace">能力供给</text>

      <rect x="252" y="496" width="20" height="16" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="284" y="508" fill="#4f5d75" font-size="8" font-family="'Geist Mono','PingFang SC',monospace">仿真与合成数据 · 焦点</text>

      <rect x="456" y="496" width="20" height="16" rx="4" fill="none" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="488" y="508" fill="#4f5d75" font-size="8" font-family="'Geist Mono','PingFang SC',monospace">分层</text>
    </svg>
  </div>
</body>
</html>
