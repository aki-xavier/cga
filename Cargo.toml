[workspace]
resolver = "2"
members = [
    "crates/cga-core",
    "crates/cga-collision",
    "crates/cga-mesh",
    "crates/cga-gpu",
    "crates/cga-host",
    "crates/cga-examples",
]

[workspace.dependencies]
mlx-rs = "0.32"


[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
