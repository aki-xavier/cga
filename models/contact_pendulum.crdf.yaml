# 接触 demo 摆锤: 铰在 z=0.5, 摆杆长 0.6, 末端圆柱碰撞体 (r=0.06, L=0.12)。
# 从 28.6° 释放, 重力使之下落, 圆柱底在 z=0 地面接触, 静止于 146.4°。
robot:
  name: contact_pendulum
  base: base
  links:
    - name: base
    - name: rod
      inertial:
        mass: 1.5
        com: [0, 0, 0.3]
        inertia: {ixx: 0.05, iyy: 0.05, izz: 0.01}
      geometry:
        - blade: cylinder
          radius: 0.06
          length: 0.12
          origin: {xyz: [0, 0, 0.54]}
          role: [visual, collision]
  joints:
    - name: j1
      type: revolute
      parent: base
      child: rod
      origin: {xyz: [0, 0, 0.5]}
      axis: [0, 1, 0]
