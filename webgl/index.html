<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>CGA WebGL — 宇树 Z1</title>
<style>
  html, body { margin: 0; height: 100%; background: #111318; color: #ddd;
    font: 13px/1.5 -apple-system, "PingFang SC", sans-serif; }
  #wrap { display: flex; height: 100%; }
  #canvas-wrap { flex: 1; position: relative; }
  canvas { display: block; width: 100%; height: 100%; }
  #hint { position: absolute; top: 10px; left: 12px; color: #889; font-size: 12px;
    pointer-events: none; text-shadow: 0 1px 2px #000; }
  #panel { width: 220px; padding: 14px; background: #181b22; border-left: 1px solid #262a33;
    overflow-y: auto; }
  #panel h1 { font-size: 14px; margin: 0 0 4px; }
  #panel .sub { color: #778; font-size: 11px; margin-bottom: 12px; }
  .j { margin: 8px 0; }
  .j label { display: block; font-size: 11px; color: #9aa; margin-bottom: 2px; }
  .j input[type=range] { width: 100%; }
  .j .val { float: right; color: #aac; }
  button { margin-top: 10px; width: 100%; padding: 6px; background: #2a3040;
    color: #dde; border: 1px solid #3a4155; border-radius: 4px; cursor: pointer; }
  button:hover { background: #343c50; }
</style>
</head>
<body>
<div id="wrap">
  <div id="canvas-wrap">
    <canvas id="c"></canvas>
    <div id="hint">拖拽旋转 · 滚轮缩放 (相机 = Motor 轨道)</div>
  </div>
  <div id="panel">
    <h1 id="title">CGA WebGL 渲染器</h1>
    <div class="sub" id="sub">加载中…</div>
    <div id="joints"></div>
    <button id="zero">全部归零</button>
  </div>
</div>
<script type="module">
import { CgaRenderer } from "./renderer.js";

const renderer = await (async () => {
  const res = await fetch("z1.json");
  if (!res.ok) throw new Error("加载 z1.json 失败: " + res.status);
  return new CgaRenderer(document.getElementById("c"), await res.json());
})();

document.getElementById("title").textContent = "CGA WebGL — " + renderer.model.robot.name;
document.getElementById("sub").textContent =
  renderer.model.robot.joints.filter((j) => j.type !== "fixed").length +
  " 个可动关节 · 隐式 blade 解析求交 · FK 走 versor 链";

// 关节滑块
const panel = document.getElementById("joints");
const sliders = [];
// 默认姿态 (舒展: 肩偏航 0.3 + 上臂 120° + 前臂前伸)
const DEFAULT_Q = [0.3, 2.0944, -2.0944, 0.4, 0.3, 0.5];
let qi = 0;
for (const j of renderer.model.robot.joints) {
  if (j.type === "fixed") continue;
  const div = document.createElement("div");
  div.className = "j";
  const lo = j.lower ?? -3.14, hi = j.upper ?? 3.14;
  const init = (j.type === "fixed") ? 0 : (DEFAULT_Q[qi++] ?? 0);
  div.innerHTML =
    `<label>${j.name} <span class="val">${init.toFixed(2)}</span></label>` +
    `<input type="range" min="${lo}" max="${hi}" step="0.01" value="${init}">`;
  const input = div.querySelector("input");
  const val = div.querySelector(".val");
  renderer.q[j.name] = init;
  input.addEventListener("input", () => {
    renderer.q[j.name] = parseFloat(input.value);
    val.textContent = parseFloat(input.value).toFixed(2);
    draw();
  });
  panel.appendChild(div);
  sliders.push(input);
}
document.getElementById("zero").addEventListener("click", () => {
  for (const s of sliders) { s.value = 0; s.dispatchEvent(new Event("input")); }
});

// 轨道控制 (拖拽 = azimuth/elevation, 滚轮 = radius)
let dragging = false, lastX = 0, lastY = 0;
const cv = document.getElementById("c");
cv.addEventListener("mousedown", (e) => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
window.addEventListener("mouseup", () => { dragging = false; });
window.addEventListener("mousemove", (e) => {
  if (!dragging) return;
  renderer.azimuth -= (e.clientX - lastX) * 0.008;
  renderer.elevation = Math.max(-1.4, Math.min(1.4, renderer.elevation + (e.clientY - lastY) * 0.008));
  lastX = e.clientX; lastY = e.clientY;
  draw();
});
cv.addEventListener("wheel", (e) => {
  e.preventDefault();
  renderer.radius = Math.max(0.4, Math.min(8, renderer.radius * (1 + e.deltaY * 0.001)));
  draw();
}, { passive: false });

function draw() { renderer.render(); }
window.__renderer = renderer;

function fit() {
  const w = document.getElementById("canvas-wrap").clientWidth;
  const h = document.getElementById("canvas-wrap").clientHeight;
  renderer.resize(w, h);
  draw();
}
window.addEventListener("resize", fit);
fit();

// 调试钩子: 降采样读像素 (验证用)
window.__snapshot = (n) => {
  const gl = renderer.gl, W = renderer.canvas.width, H = renderer.canvas.height;
  const buf = new Uint8Array(W * H * 4);
  gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, buf);
  const out = new Uint8Array(n * n * 4);
  for (let y = 0; y < n; y++)
    for (let x = 0; x < n; x++) {
      const sx = Math.floor((x + 0.5) / n * W), sy = Math.floor((y + 0.5) / n * H);
      const si = (sy * W + sx) * 4, oi = (y * n + x) * 4;
      out[oi] = buf[si]; out[oi + 1] = buf[si + 1]; out[oi + 2] = buf[si + 2]; out[oi + 3] = 255;
    }
  return Array.from(out);
};
</script>
</body>
</html>
